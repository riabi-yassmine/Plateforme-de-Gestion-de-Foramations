<div class="container mt-4">
  <h2><i class="bi bi-journal-check"></i> Inscriptions ({{ inscriptions.length }})</h2>

  <p *ngIf="inscriptions.length === 0" class="text-muted text-center py-4">
    <i class="bi bi-emoji-frown"></i> Aucune inscription trouvée.
  </p>

  <div *ngIf="inscriptions.length > 0" class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Candidat</th>
          <th>Email</th>
          <th>Formation</th>
          <th>Session</th>
          <th>Du</th>
          <th>Au</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let insc of inscriptions">
          <td>{{ insc.candidat }}</td>
          <td>{{ insc.email }}</td>
          <td>{{ insc.formation }}</td>
          <td>{{ insc.session }}</td>
          <td>{{ insc.dateDebut }}</td>
          <td>{{ insc.dateFin }}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-danger" (click)="remove(insc.id)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
