<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-people"></i> Candidats ({{ filtered.length }})</h2>
    <button class="btn btn-primary btn-sm" (click)="openAdd()">
      <i class="bi bi-plus-lg me-1"></i> Ajouter
    </button>
  </div>

  <input #searchInput type="text" class="form-control mb-3"
    placeholder="Rechercher par nom, prénom ou email..."
    (input)="onSearch(searchInput.value)">

  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Email</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of paged">
          <td>{{ c.id }}</td>
          <td>{{ c.nom }}</td>
          <td>{{ c.prenom }}</td>
          <td>{{ c.email }}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary me-1" (click)="openModal(c)">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="remove(c.id!)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="filtered.length === 0">
          <td colspan="5" class="text-center text-muted py-4">
            <i class="bi bi-emoji-frown"></i> Aucun candidat trouvé
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <nav *ngIf="totalPages > 1">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="setPage(currentPage - 1)">‹</button>
      </li>
      <li class="page-item" *ngFor="let p of pages()" [class.active]="currentPage === p">
        <button class="page-link" (click)="setPage(p)">{{ p }}</button>
      </li>
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link" (click)="setPage(currentPage + 1)">›</button>
      </li>
    </ul>
  </nav>

  <!-- Modal -->
  <div *ngIf="modalVisible" class="modal d-block" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ isEditing ? 'Modifier le candidat' : 'Ajouter un candidat' }}</h5>
          <button type="button" class="btn-close" (click)="modalVisible = false"></button>
        </div>
        <div class="modal-body">
          <div *ngIf="erreur" class="alert alert-danger">{{ erreur }}</div>
          <form #f="ngForm">
            <div class="mb-3">
              <label class="form-label">Nom *</label>
              <input type="text" class="form-control" [(ngModel)]="modalModel.nom" name="nom" required
                [class.is-invalid]="nomCtrl.invalid && nomCtrl.touched" #nomCtrl="ngModel">
              <div class="invalid-feedback">Le nom est requis.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Prénom *</label>
              <input type="text" class="form-control" [(ngModel)]="modalModel.prenom" name="prenom" required
                [class.is-invalid]="prenomCtrl.invalid && prenomCtrl.touched" #prenomCtrl="ngModel">
              <div class="invalid-feedback">Le prénom est requis.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Email *</label>
              <input type="email" class="form-control" [(ngModel)]="modalModel.email" name="email" required email
                [class.is-invalid]="emailCtrl.invalid && emailCtrl.touched" #emailCtrl="ngModel">
              <div class="invalid-feedback">Un email valide est requis.</div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="modalVisible = false">Annuler</button>
          <button type="button" class="btn btn-primary" (click)="save()" [disabled]="!f.valid">
            {{ isEditing ? 'Mettre à jour' : 'Ajouter' }}
          </button>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="modalVisible" class="modal-backdrop fade show"></div>
</div>
